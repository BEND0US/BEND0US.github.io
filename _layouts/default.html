<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      body{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; max-width:900px;margin:24px auto;padding:0 16px;color:#222}
      header{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
      .site-title{font-weight:700;font-size:20px}
      nav.tabs{display:flex;gap:8px;flex-wrap:wrap}
      nav.tabs a{padding:8px 12px;border-radius:6px;text-decoration:none;background:#f2f2f2;color:#111}
      nav.tabs a[aria-current="page"], nav.tabs a.active{background:#111;color:#fff}
      main{margin-top:12px}
      footer{margin-top:36px;color:#666;font-size:13px;border-top:1px solid #eee;padding-top:12px}
      .post-list{list-style:none;padding-left:0}
      .post-list li{margin-bottom:12px}
      .post-meta{color:#666;font-size:13px;margin-left:6px}
      .excerpt{color:#444}
    </style>
  </head>
  <body>
    <header>
      <div class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
      <div class="site-desc">{{ site.description }}</div>

      <nav class="tabs" role="navigation" aria-label="Main">
        {% for p in site.header_pages %}
          {% assign page_obj = site.pages | where: "path", p | first %}
          {% if page_obj %}
            <a href="{{ page_obj.url | relative_url }}" {% if page.url == page_obj.url %}aria-current="page"{% endif %}>{{ page_obj.title }}</a>
          {% else %}
            <!-- fallback: show file name -->
            <a href="{{ '/' | append: p | relative_url }}">{{ p }}</a>
          {% endif %}
        {% endfor %}
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      © {{ site.title }} • {{ site.author.name }}
    </footer>
  </body>
</html>
